{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <img src="{{ url_for('static', filename='images/kast-logo.png') }}"
                         alt="KAST Logo"
                         style="max-width: 150px;"
                         class="mb-3">
                    <h3 class="card-title">Check your email</h3>
                    <p class="text-muted mt-3">
                        If an account exists for the address you entered, we've sent it
                        a password reset link. The link will expire in 60 minutes.
                    </p>
                    <p class="text-muted small">
                        Didn't get an email? Check your spam folder, then request another link.
                    </p>
                    <div class="d-grid mt-4">
                        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                            Back to login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
