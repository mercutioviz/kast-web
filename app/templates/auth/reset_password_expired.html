{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <img src="{{ url_for('static', filename='images/kast-logo.png') }}"
                         alt="KAST Logo"
                         style="max-width: 150px;"
                         class="mb-3">
                    <h3 class="card-title">Reset link expired or invalid</h3>
                    <p class="text-muted mt-3">
                        This password reset link has expired, has already been used, or
                        was never valid. Please request a new one.
                    </p>
                    <div class="d-grid gap-2 mt-4">
                        <a href="{{ url_for('auth.forgot_password') }}" class="btn btn-primary">
                            Request a new reset link
                        </a>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">
                            Back to login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
