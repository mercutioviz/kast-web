# Nginx configuration for KAST Web v2 (parallel install on port 8080).
# Place this file in /etc/nginx/sites-available/ and symlink into sites-enabled/.
# Coexists with the v1 server block on port 80; same hostname, different port.

upstream kast_web2 {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 8080;
    server_name kast3dev.cudahack.net;

    client_max_body_size 16M;

    access_log /var/log/nginx/kast-web2-access.log;
    error_log /var/log/nginx/kast-web2-error.log;

    location /static {
        alias /opt/kast-web2/app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_redirect off;
        proxy_pass http://kast_web2;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://kast_web2/socket.io;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
